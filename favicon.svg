<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161822"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="6"/>

  <!-- Code Brackets + AI Sparkle Symbol -->
  <path d="M160 170 L80 256 L160 342" fill="none" stroke="url(#aiGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M352 170 L432 256 L352 342" fill="none" stroke="url(#aiGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- AI Sparkle Core -->
  <path d="M256 160 Q256 256 160 256 Q256 256 256 352 Q256 256 352 256 Q256 256 256 160 Z" fill="url(#aiGrad)" filter="url(#glow)"/>
</svg>
